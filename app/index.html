<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarklet Collection</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="includes/ui/styles.css">
</head>
<body>
    <!-- Navbar Container - Popolata dinamicamente -->
    <nav id="bookmarklet-navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <span id="navbar-logo">📚 Bookmarklets</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarContent">
                <!-- Menu dinamico popolato da registry.js -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="bookmarklet-menu">
                    <!-- Popolato dinamicamente -->
                </ul>
                
                <!-- Info versione e repo -->
                <div class="navbar-text text-light">
                    <small>
                        <span id="repo-version">v-</span> | 
                        <span id="last-update">-</span>
                    </small>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Benvenuto nella Bookmarklet Collection</h1>
                <p class="lead">Seleziona un bookmarklet dal menu per visualizzare i dettagli e il codice di installazione.</p>
            </div>
        </div>

        <!-- Griglia Bookmarklet - Popolata dinamicamente -->
        <div class="row mt-4" id="bookmarklet-grid">
            <!-- Popolato dinamicamente da registry.js -->
        </div>

        <!-- Dettaglio Bookmarklet -->
        <div class="row mt-5" id="bookmarklet-detail" style="display: none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3 id="detail-title"></h3>
                    </div>
                    <div class="card-body">
                        <p id="detail-description"></p>
                        <h5>Codice Bookmarklet:</h5>
                        <pre class="bg-light p-3 rounded"><code id="detail-code"></code></pre>
                        <button class="btn btn-primary" id="copy-code-btn">📋 Copia Codice</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Core Scripts -->
    <script src="core/loader.js"></script>
    <script src="core/registry.js"></script>
    <script src="includes/ui/navbar.js"></script>
    
    <!-- Inizializzazione -->
    <script>
        // Inizializza il sistema quando la pagina è caricata
        document.addEventListener('DOMContentLoaded', () => {
            BookmarkletRegistry.init();
        });
    </script>
</body>
</html>
